name: Worklog CRM checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worklog
          POSTGRES_USER: worklog
          POSTGRES_PASSWORD: worklog-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worklog -d worklog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py spectacular --validate --fail-on-warn
      - run: docker compose config --quiet
      - name: Start the containerized application
        run: docker compose up --build --wait --wait-timeout 90
      - name: Check the demo instance
        run: |
          docker compose exec -T app python manage.py seed_demo --password "Worklog-Local-7781"
          curl --fail --silent http://127.0.0.1:8000/health/
          curl --fail --silent http://127.0.0.1:8000/api/docs/ --output /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
